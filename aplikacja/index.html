<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQuiz - Quiz dla Studentów Medycyny</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            margin: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 24px;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .progress-panel {
            background: #f1f5f9;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .progress-panel.active {
            display: flex;
        }

        .reset-progress-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reset-progress-btn:hover {
            background-color: #dc2626;
        }

        .menu-screen, .submenu-screen {
            text-align: center;
            display: none;
        }

        .menu-screen.active, .submenu-screen.active {
            display: block;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .nick-box {
            background: #f8fafc;
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .nick-box input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 15px;
            width: 80%;
            max-width: 280px;
            text-align: center;
            outline: none;
        }

        .nick-box input:focus {
            border-color: var(--primary);
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-btn {
            background-color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            text-align: left;
        }

        .category-btn:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .quiz-screen {
            display: none;
        }

        .quiz-screen.active {
            display: block;
        }

        .quiz-header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .quit-btn {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .quit-btn:hover {
            background-color: #fecaca;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
            font-weight: 600;
        }

        .explanation-box {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }

        .explanation-box.visible {
            display: block;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .next-btn.visible {
            display: block;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen.active {
            display: block;
        }

        .result-screen h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-circle {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            padding: 14px;
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MediQuiz</h1>
            <p>Interaktywny panel powtórkowy dla studentów medycyny</p>
        </header>

        <div class="progress-panel" id="progress-panel">
            <span id="progress-counter">Opanowane: 0 / 0 pytań</span>
            <button class="reset-progress-btn" onclick="resetProgress()">Resetuj postęp</button>
        </div>

        <div class="menu-screen active" id="menu-main">
            <div class="nick-box">
                <label for="nickname" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">Twój Nick / Pseudonim:</label>
                <input type="text" id="nickname" placeholder="np. StudentMedyczny">
            </div>

            <h2>Wybierz główny dział:</h2>
            <div class="category-list">
                <button class="category-btn" onclick="selectMainCategory('Anatomia')">🧠 Anatomia</button>
                <button class="category-btn" onclick="selectMainCategory('Fizjologia')">⚡ Fizjologia</button>
                <button class="category-btn" onclick="startQuiz('All', 'All')">🔄 Wszystkie pytania (Mieszane)</button>
            </div>
        </div>

        <div class="submenu-screen" id="menu-sub">
            <button class="back-btn" onclick="goToMainCatalog()">← Wróć do wyboru działów</button>
            <h2>Wybierz podkategorię z Anatomii:</h2>
            <div class="category-list">
                <button class="category-btn" onclick="startQuiz('Anatomia', 'All')">📁 Wszystka Anatomia</button>
                <button class="category-btn" onclick="startQuiz('Anatomia', 'Klatka piersiowa')">🫁 Klatka piersiowa</button>
                <button class="category-btn" onclick="startQuiz('Anatomia', 'Brzuch')">🩺 Brzuch</button>
                <button class="category-btn" onclick="startQuiz('Anatomia', 'Miednica')">🦴 Miednica</button>
                <button class="category-btn" onclick="startQuiz('Anatomia', 'Szyja')">🗣️ Szyja</button>
                <button class="category-btn" onclick="startQuiz('Anatomia', 'Kregoslup')">🦴 Kręgosłup</button>
            </div>
        </div>

        <div class="quiz-screen" id="quiz-screen">
            <div class="quiz-header-nav">
                <button class="quit-btn" onclick="confirmQuit()">← Przerwij quiz</button>
                <span id="active-category-label" style="font-size: 13px; color: var(--text-muted); font-weight: 600;"></span>
            </div>

            <div class="quiz-info">
                <span id="question-category">Kategoria: Anatomia</span>
                <span id="question-counter">Pytanie 1 z 10</span>
            </div>

            <div class="question-box" id="question-text">
                Ładowanie pytania...
            </div>

            <div class="options-list" id="options-container"></div>

            <div class="explanation-box" id="explanation-box">
                <strong>Wyjaśnienie:</strong> <span id="explanation-text"></span>
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Następne pytanie</button>
        </div>

        <div class="result-screen" id="result-screen">
            <h2>Koniec quizu! 🎉</h2>
            <p id="result-user-info" style="font-weight: 600; color: var(--primary); margin-bottom: 5px;"></p>
            <p>Twój wynik:</p>
            <div class="score-circle" id="score-text">0/10</div>
            <p id="result-message">Świetna robota!</p>
            <div class="action-buttons">
                <button class="btn-primary" onclick="restartQuiz()">Rozwiąż ponownie</button>
                <button class="btn-secondary" onclick="goToMenu()">Wybierz kategorię</button>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                id: 1,
                category: "Anatomia",
                subcategory: "Klatka piersiowa",
                question: "Która struktura anatomiczna oddziela klatkę piersiową od jamy brzusznej?",
                options: ["Opłucna", "Przepona", "Osierdzie", "Otrzewna"],
                correct: 1,
                explanation: "Przepona (diaphragm) to główny mięsień oddechowy stanowiący granicę między klatką piersiową a brzuchem."
            },
            {
                id: 2,
                category: "Anatomia",
                subcategory: "Klatka piersiowa",
                question: "Jak nazywa się największa tętnica w ludzkim organizmie?",
                options: ["Tętnica płucna", "Aorta (tętnica główna)", "Tętnica szyjna wspólna", "Tętnica wieńcowa"],
                correct: 1,
                explanation: "Aorta wychodzi bezpośrednio z lewej komory serca i rozprowadza natlenowaną krew do całego organizmu."
            },
            {
                id: 3,
                category: "Anatomia",
                subcategory: "Szyja",
                question: "Który nerw czaszkowy odpowiada za unerwienie ruchowe mięśni mimicznych twarzy?",
                options: ["Nerw trójdzielny (V)", "Nerw twarzowy (VII)", "Nerw podjęzykowy (XII)", "Nerw błędny (X)"],
                correct: 1,
                explanation: "Nerw twarzowy (VII) unerwia mięśnie wyrazowe twarzy. Nerw trójdzielny (V) odpowiada głównie za czucie na twarzy."
            },
            {
                id: 4,
                category: "Anatomia",
                subcategory: "Brzuch",
                question: "Który narząd jamy brzusznej odpowiada m.in. za produkcję żółci i detoksykację?",
                options: ["Śledziona", "Trzustka", "Wątroba", "Żołądek"],
                correct: 2,
                explanation: "Wątroba to największy gruczoł w ciele człowieka, pełniący kluczową rolę w metabolizmie, magazynowaniu substancji i produkcji żółci."
            },
            {
                id: 5,
                category: "Anatomia",
                subcategory: "Miednica",
                question: "Która kość nie wchodzi w skład miednicy (kość miedniczna powstała z jej zrośnięcia)?",
                options: ["Kość biodrowa", "Kość kulszowa", "Kość łonowa", "Kość udowa"],
                correct: 3,
                explanation: "Kość udowa to kość kończyny dolnej, która jedynie tworzy staw biodrowy z panewką kości miednicznej."
            },
            {
                id: 6,
                category: "Anatomia",
                subcategory: "Kregoslup",
                question: "Jak nazywa się pierwszy kręg szyjny (C1), który dźwiga czaszkę?",
                options: ["Obrotnik (Axis)", "Kręg wystający (Vertebra prominens)", "Kręg szczytowy (Atlas)", "Kość krzyżowa"],
                correct: 2,
                explanation: "Atlas (kręg szczytowy) nie posiada trzonu i bezpośrednio łączy się z kłykciami potylicznymi czaszki."
            },
            {
                id: 7,
                category: "Anatomia",
                subcategory: "Kregoslup",
                question: "Który kręg (C2) posiada charakterystyczny wyrostek zębowaty (dens)?",
                options: ["Atlas", "Obrotnik (Axis)", "Trzeci kręg szyjny", "Pierwszy kręg piersiowy"],
                correct: 1,
                explanation: "Obrotnik (Axis) posiada wyrostek zębowaty, wokół którego obraca się atlas wraz z czaszką."
            },
            {
                id: 8,
                category: "Fizjologia",
                subcategory: "All",
                question: "Która struktura w sercu jest naturalnym rozrusznikiem serca (głównym ośrodkiem bodźcotwórczym)?",
                options: ["Węzeł przedsionkowo-komorowy", "Pęczek Hisa", "Węzeł zatokowo-przedsionkowy", "Włókna Purkinjego"],
                correct: 2,
                explanation: "Węzeł zatokowo-przedsionkowy (SA node) położony w ścianie prawego przedsionka generuje impulsy elektryczne najszybciej, nadając rytm całemu sercu."
            },
            {
                id: 9,
                category: "Fizjologia",
                subcategory: "All",
                question: "Jaki jest główny narząd odpowiedzialny za regulację gospodarki wodno-elektrolitowej oraz wydalanie mocznika?",
                options: ["Wątroba", "Trzustka", "Nerki", "Śledziona"],
                correct: 2,
                explanation: "Nerki filtrują krew, usuwają produkty przemiany materii (np. mocznik) oraz precyzyjnie regulują poziom wody i elektrolitów."
            }
        ];

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let currentCategory = "All";
        let currentSubcategory = "All";

        const menuMain = document.getElementById("menu-main");
        const menuSub = document.getElementById("menu-sub");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const progressPanel = document.getElementById("progress-panel");

        const nickInput = document.getElementById("nickname");
        const questionCategory = document.getElementById("question-category");
        const questionCounter = document.getElementById("question-counter");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const nextBtn = document.getElementById("next-btn");
        const scoreText = document.getElementById("score-text");
        const resultMessage = document.getElementById("result-message");
        const resultUserInfo = document.getElementById("result-user-info");
        const progressCounter = document.getElementById("progress-counter");
        const activeCategoryLabel = document.getElementById("active-category-label");

        function getMasteredIds() {
            const data = localStorage.getItem("mediquiz_mastered");
            return data ? JSON.parse(data) : [];
        }

        function saveMasteredIds(ids) {
            localStorage.setItem("mediquiz_mastered", JSON.stringify(ids));
            updateProgressDisplay();
        }

        function updateProgressDisplay() {
            const mastered = getMasteredIds();
            let currentPool = [];
            if (currentCategory === "All") {
                currentPool = [...allQuestions];
            } else if (currentSubcategory === "All") {
                currentPool = allQuestions.filter(q => q.category === currentCategory);
            } else {
                currentPool = allQuestions.filter(q => q.category === currentCategory && q.subcategory === currentSubcategory);
            }
            const total = currentPool.length;
            const masteredCount = currentPool.filter(q => mastered.includes(q.id)).length;
            progressCounter.textContent = `Opanowane: ${masteredCount} / ${total} pytań`;
        }

        function resetProgress() {
            if (confirm("Czy na pewno chcesz zresetować postęp nauki dla tej sekcji i odblokować pytania?")) {
                const mastered = getMasteredIds();
                let currentPool = [];
                if (currentCategory === "All") {
                    currentPool = [...allQuestions];
                } else if (currentSubcategory === "All") {
                    currentPool = allQuestions.filter(q => q.category === currentCategory);
                } else {
                    currentPool = allQuestions.filter(q => q.category === currentCategory && q.subcategory === currentSubcategory);
                }
                const currentPoolIds = currentPool.map(q => q.id);
                const updatedMastered = mastered.filter(id => !currentPoolIds.includes(id));
                saveMasteredIds(updatedMastered);
                alert("Postęp w tej sekcji został zresetowany!");
                startQuiz(currentCategory, currentSubcategory);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedNick = localStorage.getItem("mediquiz_nick");
            if (savedNick) {
                nickInput.value = savedNick;
            }
        });

        function getValidatedNick() {
            let nick = nickInput.value.trim();
            if (nick === "") {
                nick = "Anonim";
            }
            localStorage.setItem("mediquiz_nick", nick);
            return nick;
        }

        function selectMainCategory(category) {
            getValidatedNick();
            currentCategory = category;
            currentSubcategory = "All";

            if (category === 'Anatomia') {
                menuMain.classList.remove("active");
                menuSub.classList.add("active");
                progressPanel.classList.remove("active");
            } else if (category === 'Fizjologia') {
                startQuiz('Fizjologia', 'All');
            }
        }

        function goToMainCatalog() {
            menuSub.classList.remove("active");
            menuMain.classList.add("active");
            progressPanel.classList.remove("active");
        }

        function confirmQuit() {
            if (confirm("Czy na pewno chcesz opuścić grę? Twój obecny postęp w tej rundzie zostanie utracony.")) {
                goToMenu();
            }
        }

        function startQuiz(category, subcategory) {
            getValidatedNick();
            currentCategory = category;
            currentSubcategory = subcategory;

            progressPanel.classList.add("active");
            updateProgressDisplay();

            if (category === "All") {
                activeCategoryLabel.textContent = "Wszystkie działy";
            } else if (subcategory === "All") {
                activeCategoryLabel.textContent = category;
            } else {
                activeCategoryLabel.textContent = `${category} / ${subcategory}`;
            }

            let filteredQuestions = [];
            if (category === "All") {
                filteredQuestions = [...allQuestions];
            } else if (subcategory === "All") {
                filteredQuestions = allQuestions.filter(q => q.category === category);
            } else {
                filteredQuestions = allQuestions.filter(q => q.category === category && q.subcategory === subcategory);
            }

            if (filteredQuestions.length === 0) {
                alert("Brak pytań w tej podkategorii!");
                goToMenu();
                return;
            }

            const mastered = getMasteredIds();
            let unmastered = filteredQuestions.filter(q => !mastered.includes(q.id));

            if (unmastered.length === 0) {
                alert("Gratulacje! Opanowałeś już wszystkie pytania w tej sekcji. Rozpoczynamy powtórkę całości!");
                unmastered = [...filteredQuestions];
            }

            for (let i = unmastered.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unmastered[i], unmastered[j]] = [unmastered[j], unmastered[i]];
            }

            const maxQuestionsPerRound = 10;
            activeQuestions = unmastered.slice(0, maxQuestionsPerRound);

            currentQuestionIndex = 0;
            score = 0;

            menuMain.classList.remove("active");
            menuSub.classList.remove("active");
            resultScreen.classList.remove("active");
            quizScreen.classList.add("active");

            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            explanationBox.classList.remove("visible");
            nextBtn.classList.remove("visible");
            optionsContainer.innerHTML = "";

            const current = activeQuestions[currentQuestionIndex];
            const subText = current.subcategory !== "All" ? ` / ${current.subcategory}` : "";
            questionCategory.textContent = `Dział: ${current.category}${subText}`;
            questionCounter.textContent = `Pytanie ${currentQuestionIndex + 1} z ${activeQuestions.length}`;
            questionText.textContent = current.question;

            current.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.textContent = option;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const current = activeQuestions[currentQuestionIndex];
            const optionButtons = optionsContainer.children;
            let mastered = getMasteredIds();

            if (selectedIndex === current.correct) {
                optionButtons[selectedIndex].classList.add("correct");
                score++;
                if (!mastered.includes(current.id)) {
                    mastered.push(current.id);
                    saveMasteredIds(mastered);
                }
            } else {
                optionButtons[selectedIndex].classList.add("incorrect");
                optionButtons[current.correct].classList.add("correct");
                if (mastered.includes(current.id)) {
                    mastered = mastered.filter(id => id !== current.id);
                    saveMasteredIds(mastered);
                }
            }

            for (let btn of optionButtons) {
                btn.disabled = true;
            }

            explanationText.textContent = current.explanation;
            explanationBox.classList.add("visible");
            nextBtn.classList.add("visible");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");
            
            const currentNick = localStorage.getItem("mediquiz_nick") || "Studencie";
            resultUserInfo.textContent = `Gracz: ${currentNick}`;
            scoreText.textContent = `${score} / ${activeQuestions.length}`;

            let percentage = (score / activeQuestions.length) * 100;
            if (percentage === 100) {
                resultMessage.textContent = `Perfekcyjnie, ${currentNick}! Sesja na pewno zlana na 5.0! 🏆`;
            } else if (percentage >= 50) {
                resultMessage.textContent = `Dobry wynik, ${currentNick}, ale błędne odpowiedzi wrócą do kolejnych testów. 👍`;
            } else {
                resultMessage.textContent = `Musisz jeszcze trochę usiąść do książek, ${currentNick}! Głowa do góry. 📚`;
            }
            updateProgressDisplay();
        }

        function restartQuiz() {
            startQuiz(currentCategory, currentSubcategory);
        }

        function goToMenu() {
            quizScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            menuSub.classList.remove("active");
            menuMain.classList.add("active");
            progressPanel.classList.remove("active");
        }
    </script>
</body>
</html>
